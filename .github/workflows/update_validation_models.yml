name: Actualizar modelos de validación

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update_validation_models.yml'

  schedule:
    # 06:20 UTC = 00:20 hora de El Salvador.
    # Se ejecuta después del pronóstico operativo de main (06:00 UTC).
    - cron: '20 6 * * *'

  # Permite ejecutar los cuatro modelos manualmente desde GitHub Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validation-models-daily
  cancel-in-progress: false

jobs:
  update-validation-models:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ECMWF land
            branch: validation/ecmwf-land
            script: validation/fetch_ecmwf_land.py
            folder: ecmwf_land
          - name: Best Match
            branch: validation/best-match
            script: validation/fetch_best_match.py
            folder: best_match
          - name: GFS
            branch: validation/gfs
            script: validation/fetch_gfs.py
            folder: gfs
          - name: ICON
            branch: validation/icon
            script: validation/fetch_icon.py
            folder: icon

    env:
      TZ: America/El_Salvador

    steps:
      - name: Checkout rama del modelo
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install \
            openmeteo-requests \
            requests-cache \
            retry-requests \
            numpy \
            pandas
        working-directory: Wind_forecasts

      - name: Descargar pronóstico de validación
        run: python ${{ matrix.script }}
        working-directory: Wind_forecasts

      - name: Guardar latest e histórico diario
        run: |
          FECHA=$(date +%F)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Wind_forecasts/data/validation/${{ matrix.folder }}/"

          if git diff --staged --quiet; then
            echo "No hay cambios nuevos para ${{ matrix.name }}."
          else
            git commit -m "Auto-update validation ${{ matrix.name }} $FECHA"
            git push origin "HEAD:${{ matrix.branch }}"
          fi

  consolidate-all-models:
    name: Consolidar y preparar descarga
    needs: update-validation-models
    runs-on: ubuntu-latest
    env:
      TZ: America/El_Salvador

    steps:
      - name: Checkout rama consolidada
        uses: actions/checkout@v4
        with:
          ref: validation/all-models
          fetch-depth: 0

      - name: Obtener ramas actualizadas
        run: |
          git fetch origin \
            main \
            validation/ecmwf-land \
            validation/best-match \
            validation/gfs \
            validation/icon \
            validation/all-models

      - name: Reunir toda la información
        run: |
          rm -rf All_model_data
          mkdir -p \
            All_model_data/ecmwf_actual \
            All_model_data/ecmwf_land \
            All_model_data/best_match \
            All_model_data/gfs \
            All_model_data/icon

          TMPDIR=$(mktemp -d)
          mkdir -p "$TMPDIR/main" "$TMPDIR/ecmwf" "$TMPDIR/best" "$TMPDIR/gfs" "$TMPDIR/icon"

          git archive origin/main Wind_forecasts/data | tar -x -C "$TMPDIR/main"
          cp -a "$TMPDIR/main/Wind_forecasts/data/." All_model_data/ecmwf_actual/

          git archive origin/validation/ecmwf-land Wind_forecasts/data/validation/ecmwf_land | tar -x -C "$TMPDIR/ecmwf"
          cp -a "$TMPDIR/ecmwf/Wind_forecasts/data/validation/ecmwf_land/." All_model_data/ecmwf_land/

          git archive origin/validation/best-match Wind_forecasts/data/validation/best_match | tar -x -C "$TMPDIR/best"
          cp -a "$TMPDIR/best/Wind_forecasts/data/validation/best_match/." All_model_data/best_match/

          git archive origin/validation/gfs Wind_forecasts/data/validation/gfs | tar -x -C "$TMPDIR/gfs"
          cp -a "$TMPDIR/gfs/Wind_forecasts/data/validation/gfs/." All_model_data/gfs/

          git archive origin/validation/icon Wind_forecasts/data/validation/icon | tar -x -C "$TMPDIR/icon"
          cp -a "$TMPDIR/icon/Wind_forecasts/data/validation/icon/." All_model_data/icon/

          rm -rf "$TMPDIR"

      - name: Guardar consolidado en GitHub
        run: |
          FECHA=$(date +%F)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A All_model_data/

          if git diff --staged --quiet; then
            echo "El consolidado ya está actualizado."
          else
            git commit -m "Update all model data $FECHA"
            git push origin HEAD:validation/all-models
          fi

      - name: Crear descarga única ZIP
        uses: actions/upload-artifact@v4
        with:
          name: todos-los-pronosticos
          path: All_model_data/
          if-no-files-found: error
          retention-days: 90

