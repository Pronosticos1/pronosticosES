name: Validar ICON

on:
  push:
    branches:
      - 'validation/icon'
    paths:
      - 'Wind_forecasts/validation/fetch_icon.py'
      - '.github/workflows/validate_icon.yml'

permissions:
  contents: write

jobs:
  validate-model:
    runs-on: ubuntu-latest
    env:
      TZ: America/El_Salvador

    defaults:
      run:
        working-directory: Wind_forecasts

    steps:
      - name: Checkout rama de validación
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install openmeteo-requests requests-cache retry-requests numpy pandas

      - name: Ejecutar modelo de validación
        run: python validation/fetch_icon.py

      - name: Guardar resultados de validación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/icon/

          if git diff --staged --quiet; then
            echo "No hay cambios nuevos para guardar."
          else
            FECHA=$(date +%F)
            git commit -m "Validation icon $FECHA"
            git push
          fi
