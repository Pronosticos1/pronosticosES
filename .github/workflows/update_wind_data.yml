name: Actualizar datos de viento

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Wind_forecasts

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install \
            openmeteo-requests \
            requests-cache \
            retry-requests \
            numpy \
            pandas \
            shapely

      - name: Ejecutar script
        run: python fetch_wind_data.py

      - name: Commit y push del CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wind_forecast_latest.csv
          git diff --staged --quiet || git commit -m "Auto-update wind forecast"
          git push
