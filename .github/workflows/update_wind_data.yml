
# .github/workflows/update_wind_data.yml
# ─────────────────────────────────────────────────────────────────
# Corre cada día a las 06:00 UTC (00:00 El Salvador)
# Descarga datos → guarda CSV → hace commit al repositorio
# Power BI lee el CSV crudo desde la URL del archivo en GitHub
# ─────────────────────────────────────────────────────────────────

name: Actualizar datos de viento

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = medianoche El Salvador
  workflow_dispatch:       # también permite correrlo manualmente desde GitHub

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:

      # 1. Clonar el repositorio
      - name: Checkout repositorio
        uses: actions/checkout@v4

      # 2. Instalar Python
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          pip install \
            openmeteo-requests \
            requests-cache \
            retry-requests \
            numpy \
            pandas \
            shapely

      # 4. Correr el script de descarga
      - name: Ejecutar fetch_wind_data.py
        run: python fetch_wind_data.py

      # 5. Hacer commit del CSV actualizado
      - name: Commit y push del CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wind_forecast_latest.csv
          git diff --staged --quiet || git commit -m "🌬️ Auto-update: wind forecast $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
